# Fire lights for the headset (TASK_10, step 1).
#
# Which models are fires that light their surroundings, and how. Read once at
# start. A line is
#
#   <pattern> <radius yd> <r> <g> <b> <intensity>
#
# where <pattern> is matched as a substring of the model's file name, lower
# case, and the first matching line wins. `none` in place of the numbers says
# the model is not a fire whatever its name. A model with its own light
# (M2Light) keeps that light's colour and reach; the line then only says it is
# a fire. Models the client already knows for fires (braziers, campfires,
# torches, forges) need no line: their light comes from their size.
#
# Colours are about 1800-2200 K, a warm orange.

interior_mix 0.5        # share of a fire light an interior adds to its baked light

firewoodpile   8.0   1.00 0.47 0.15   1.30     # inn hearth: Cozy Fire, Warm Fire
fireplace      8.0   1.00 0.47 0.15   1.30
campfire       9.0   1.00 0.50 0.18   1.40
bonfire       14.0   1.00 0.49 0.15   1.60
brazier        7.0   1.00 0.52 0.20   1.20
forge          8.0   1.00 0.45 0.14   1.20
torch          6.0   1.00 0.55 0.20   1.10

# Named like fires, not fires.
firefly        none
fireworks      none
